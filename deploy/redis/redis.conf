# =============================================================================
# PMP Redis 配置（挂载到 /usr/local/etc/redis/redis.conf，只读）
# 密码不写入本文件，由 compose 启动命令 --requirepass 从环境变量注入
# =============================================================================
bind 0.0.0.0
protected-mode yes
port 6379

# 连接与超时
timeout 0
tcp-keepalive 300
tcp-backlog 511

# 内存：容器限制 1G，预留约 25% 给 AOF 重写与内存碎片
maxmemory 768mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# 持久化：AOF 为主（每秒刷盘），RDB 作为冷备快照
appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
aof-use-rdb-preamble yes

save 900 1
save 300 10
dbfilename dump.rdb
dir /data

# 安全：禁用/重命名高危命令
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command CONFIG "CONFIG_pmp_9f3c"
rename-command KEYS ""

# 日志
loglevel notice
logfile ""

# 慢查询
slowlog-log-slower-than 10000
slowlog-max-len 128
