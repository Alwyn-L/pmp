# =============================================================================
# PMP 前端 Nginx 主配置（挂载到 /etc/nginx/nginx.conf，只读）
# 设计要点：
#   1. 主进程以 nginx 用户运行，监听 8080 非特权端口；
#   2. pid / 临时目录全部指向 /tmp，配合只读根文件系统；
#   3. 日志输出到 stdout/stderr，由 Docker json-file 驱动统一采集；
#   4. 站点级配置由 templates/default.conf.template 在启动时渲染。
# =============================================================================
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 结构化访问日志，便于 Loki/ELK 解析
    log_format json_main escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
      '"request":"$request","status":$status,"body_bytes":$body_bytes_sent,'
      '"request_time":$request_time,"upstream_time":"$upstream_response_time",'
      '"request_id":"$request_id","referer":"$http_referer",'
      '"user_agent":"$http_user_agent","upstream":"$upstream_addr"}';
    access_log /dev/stdout json_main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens   off;

    # 只读根文件系统下的可写临时目录
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/rss+xml image/svg+xml font/woff2;

    # 站点配置（由官方镜像 20-envsubst-on-templates.sh 渲染至 conf.d）
    include /etc/nginx/conf.d/*.conf;
}
