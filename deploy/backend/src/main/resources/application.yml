# =============================================================================
# PMP 后端配置（容器内生效）
# 所有敏感项均从环境变量注入，配置文件本身不含任何密码/密钥。
# 变量来源：docker-compose.yml environment → deploy/.env
# =============================================================================
server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    threads:
      max: 200
      min-spare: 20
    max-connections: 8192
    accept-count: 200
    connection-timeout: 5s
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript

spring:
  application:
    name: pmp-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/pmp}
    username: ${DATABASE_USER:pmp}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: pmp-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3s
      connect-timeout: 3s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

app:
  env: ${APP_ENV:prod}
  kafka:
    bootstrap: ${KAFKA_BOOTSTRAP:localhost:9092}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    bucket: ${MINIO_BUCKET:pmp-files}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: pmp-backend
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.pmp: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger{40} - %msg%n"
