# =============================================================================
# PMP 制造协同平台 · 生产级 Docker Compose 编排
# 使用方式：cd deploy && cp .env.example .env && 修改 .env 后执行
#   docker compose up -d --build
# 说明：
#   1. 仅 frontend 暴露宿主机端口，中间件与后端全部走内部网络；
#   2. 所有密码、密钥一律来自 .env，禁止写入本文件；
#   3. data 网络为 internal，数据库/缓存/消息/对象存储无外网出口。
# =============================================================================
name: ${COMPOSE_PROJECT_NAME:-pmp}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-hardening: &default-hardening
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging: *default-logging

services:
  # ---------------------------------------------------------------------------
  # 接入层：前端静态资源 + 反向代理（唯一对外入口）
  # ---------------------------------------------------------------------------
  frontend:
    <<: *default-hardening
    build:
      context: ..
      dockerfile: deploy/frontend/Dockerfile
      args:
        NGINX_IMAGE: ${NGINX_IMAGE:-nginx:1.27.3-alpine}
    image: ${FRONTEND_IMAGE:-pmp/frontend:1.0.0}
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
      SERVER_NAME: ${SERVER_NAME:-_}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-20m}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./frontend/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/nginx/templates:/etc/nginx/templates:ro
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:8080"
    # 只读根文件系统：仅 /tmp 与 conf.d（模板渲染输出）可写
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /etc/nginx/conf.d:size=1m,mode=1777
    cap_drop:
      - ALL
    networks:
      - edge
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz | grep -q ok"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  # ---------------------------------------------------------------------------
  # 应用层：业务服务（Spring Boot 3 / Java 21）
  # ---------------------------------------------------------------------------
  backend:
    <<: *default-hardening
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        MAVEN_IMAGE: ${MAVEN_IMAGE:-maven:3.9.9-eclipse-temurin-21}
        JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:21-jre-alpine}
    image: ${BACKEND_IMAGE:-pmp/backend:1.0.0}
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      APP_ENV: ${APP_ENV:-prod}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP: kafka:9092
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+ExitOnOutOfMemoryError -XX:+UseG1GC -Djava.io.tmpdir=/tmp}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    networks:
      - edge
      - data
      - monitor
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ---------------------------------------------------------------------------
  # 数据层：PostgreSQL 15
  # ---------------------------------------------------------------------------
  postgres:
    <<: *default-hardening
    image: ${POSTGRES_IMAGE:-postgres:15.8-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_connections=200
      - -c
      - password_encryption=scram-sha-256
      - -c
      - log_min_duration_statement=500
      - -c
      - log_connections=on
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ---------------------------------------------------------------------------
  # 数据层：Redis 7
  # ---------------------------------------------------------------------------
  redis:
    <<: *default-hardening
    image: ${REDIS_IMAGE:-redis:7.4.1-alpine}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - sh
      - -c
      - exec redis-server /usr/local/etc/redis/redis.conf --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.2"
          memory: 256m

  # ---------------------------------------------------------------------------
  # 数据层：Kafka 3（KRaft，单节点；生产多副本见手册扩容章节）
  # ---------------------------------------------------------------------------
  kafka:
    <<: *default-hardening
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.7.1}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g
        reservations:
          cpus: "0.5"
          memory: 512m

  # ---------------------------------------------------------------------------
  # 数据层：MinIO 对象存储
  # ---------------------------------------------------------------------------
  minio:
    <<: *default-hardening
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2024-12-18T13-15-44Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL:-}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - minio_data:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.2"
          memory: 256m

  minio-init:
    image: ${MC_IMAGE:-minio/mc:RELEASE.2024-11-21T17-21-54Z}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    entrypoint: ["/bin/sh", "/scripts/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    volumes:
      - ./minio/init-buckets.sh:/scripts/init-buckets.sh:ro
    networks:
      - data
    depends_on:
      minio:
        condition: service_healthy
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # 观测层：Prometheus + Loki + Promtail + Grafana
  # ---------------------------------------------------------------------------
  prometheus:
    <<: *default-hardening
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:v2.55.1}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - monitor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy >/dev/null"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.2"
          memory: 256m

  loki:
    <<: *default-hardening
    image: ${LOKI_IMAGE:-grafana/loki:3.3.2}
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    networks:
      - monitor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready | grep -q ready"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
        reservations:
          cpus: "0.2"
          memory: 256m

  promtail:
    <<: *default-hardening
    image: ${PROMTAIL_IMAGE:-grafana/promtail:3.3.2}
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      # 只读挂载容器日志目录；不挂 docker.sock，避免等价 root 提权
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - monitor
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # promtail 官方镜像不含 curl/wget，改用 bash /dev/tcp 做端口连通性探测
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9080' || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
        reservations:
          cpus: "0.1"
          memory: 64m

  grafana:
    <<: *default-hardening
    image: ${GRAFANA_IMAGE:-grafana/grafana:11.4.0}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:3000}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    networks:
      - monitor
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health | grep -q ok"]
      interval: 20s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
        reservations:
          cpus: "0.1"
          memory: 128m

volumes:
  pg_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_pg_data
  redis_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_redis_data
  kafka_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_kafka_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_minio_data
  prometheus_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_prometheus_data
  grafana_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_grafana_data
  loki_data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_loki_data

networks:
  edge:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_edge
    driver: bridge
  data:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_data
    driver: bridge
    internal: true
  monitor:
    name: ${COMPOSE_PROJECT_NAME:-pmp}_monitor
    driver: bridge
