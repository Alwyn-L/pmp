# =============================================================================
# Prometheus 采集配置
# 目标：本实例 + 后端 actuator/prometheus（monitor 网络内解析 backend）
# =============================================================================
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    cluster: pmp

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  - job_name: pmp-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: pmp-backend

  - job_name: docker-daemon
    # 可选：Docker 引擎指标需在 daemon.json 开启 metrics-addr 后启用
    static_configs:
      - targets: ["host.docker.internal:9323"]
        labels:
          service: docker
    # 未开启时该目标只会标记为 down，不影响其他采集
